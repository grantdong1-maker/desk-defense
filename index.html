<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Idle Tower Defense</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#14181a; --panel:#1c2226; --panel2:#232b30; --border:#333d44;
    --gold:#e8b93e; --txt:#c8d2d6; --dim:#7d8b92; --red:#c9463c; --green:#6fa14f;
  }
  *{box-sizing:border-box; margin:0; padding:0; user-select:none;}
  body{background:var(--bg); font-family:"Courier New",ui-monospace,monospace; font-weight:bold;}
  #app{width:330px;}
  #topbar{display:flex; align-items:center; gap:6px; padding:4px 6px; background:var(--panel); border:1px solid var(--border); border-bottom:none; font-size:10px; color:var(--txt);}
  #logo{color:var(--green); font-size:10px;}
  .stat{display:flex; gap:3px; margin-left:auto;}
  .stat b{color:var(--gold);}
  .stat span{color:var(--dim);}
  #lives b{color:var(--red);}
  .btn{background:var(--panel2); border:1px solid var(--border); color:var(--txt); font-family:inherit; font-weight:bold; font-size:10px; padding:2px 6px; cursor:pointer;}
  .btn:hover{background:#2e383f;}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn.active{border-color:var(--gold); color:var(--gold);}
  canvas{display:block; image-rendering:pixelated; background:#0d1012; cursor:crosshair;}
  #subbar{display:flex; gap:6px; align-items:center; padding:4px 6px; background:var(--panel); border:1px solid var(--border); border-top:none; font-size:10px;}
  #waveInfo{color:var(--dim); margin-left:auto;}
  #waveInfo b{color:var(--txt);}
  #panel{background:var(--panel); border:1px solid var(--border); border-top:none; padding:5px; font-size:10px;}
  #tabs{display:flex; gap:4px; margin-bottom:5px;}
  #tabs .btn{flex:1;}
  #content{display:flex; flex-direction:column; gap:4px; min-height:118px;}
  .row{display:flex; align-items:center; gap:5px; background:var(--panel2); border:1px solid var(--border); padding:3px 5px;}
  .chip{width:12px; height:12px; border:1px solid #000; flex:none;}
  .row .nm{width:88px; color:var(--txt); white-space:nowrap; overflow:hidden;}
  .row .cost{color:var(--gold); width:46px; text-align:right;}
  .row .info{color:var(--dim); font-size:9px; padding-left:2px;}
  .row button{margin-left:auto;}
  #selBox{border:1px solid var(--gold); background:var(--panel2); padding:4px 5px; font-size:10px; line-height:1.5;}
  #selBox .t{color:var(--gold);}
  #selBox .u{color:var(--dim);}
  #log{background:#101417; border:1px solid var(--border); border-top:none; padding:3px 6px; font-size:9px; height:30px; overflow:hidden; color:var(--dim); line-height:14px;}
  #log .new{color:var(--txt);}
  #foot{font-size:8px; color:#525d63; padding:2px 6px 4px; line-height:1.4;}
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center;}
  #modal .box{background:var(--panel); border:2px solid var(--gold); padding:12px; width:260px; font-size:10px; color:var(--txt); text-align:center;}
  #modal .box h3{color:var(--gold); font-size:11px; margin-bottom:6px;}
  #modal .box p{color:var(--dim); margin-bottom:10px; line-height:1.5;}
  #banner{position:absolute; pointer-events:none; font-size:15px; letter-spacing:1px; text-shadow:1px 1px 0 #000; opacity:0;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="logo">IDLE TOWER DEFENSE</span>
    <div class="stat" id="lives"><span>LIFE</span><b id="livesV">20</b></div>
    <div class="stat" id="spdStat" title="click to change speed"><span id="spdV">x1</span></div>
    <div class="stat"><span>$</span><b id="goldV">0</b></div>
    <button class="btn" id="pauseBtn">II</button>
  </div>
  <div style="position:relative">
    <canvas id="game" width="640" height="448" style="width:320px;height:224px"></canvas>
    <div id="banner"></div>
  </div>
  <div id="subbar">
    <button class="btn" id="waveBtn">NEXT WAVE</button>
    <button class="btn active" id="autoBtn">AUTO: ON</button>
    <span id="waveInfo">WAVE <b id="waveV">1</b> · BEST <b id="bestV">1</b> · <span id="waveTimer"></span></span>
  </div>
  <div id="panel">
    <div id="tabs">
      <button class="btn active" id="tab-build">BUILD</button>
      <button class="btn" id="tab-ops">OPS</button>
      <button class="btn" id="tab-upg">UPGRADE</button>
    </div>
    <div id="content"></div>
  </div>
  <div id="log"></div>
  <div id="foot">Pin me in a screen corner (Always-on-Top / DeskPins) — gold keeps accruing at 50% while closed.<br>
  Keys: 1-6 build · U upgrade · S sell · N next wave · Space pause. Not affiliated with "Desktop Tower Defense" (2007).</div>
</div>
<div id="modal"><div class="box"><h3>WELCOME BACK, COMMANDER</h3><p id="modalMsg"></p><button class="btn" id="modalBtn">RESUME WATCH</button></div></div>

<script>
"use strict";
window._err=[]; window.addEventListener('error',e=>{(window._err=window._err||[]).push(e.message+" @L"+e.lineno);});

/* ============ CONFIG ============ */
const CELL=16, COLS=20, ROWS=14, W=COLS*CELL, H=ROWS*CELL;
const SAVE_KEY="ddzw_save_v1";

const TDEF={
  rifle:  {name:"GRUNT RIFLE", cost:50,  dmg:6,  cd:0.55,range:78,  color:"#a8935c", tip:"cheap single-shot"},
  shotgun:{name:"SHOTGUN POST",cost:130, dmg:9,  cd:0.95,range:58,  color:"#b08a3c", multi:3, tip:"hits 3 close"},
  flame:  {name:"FLAME VENT",  cost:260, dmg:3,  cd:0.30,range:52,  color:"#c05a26", burn:5, tip:"burn DoT, cone"},
  sniper: {name:"SNIPER NEST", cost:340, dmg:52, cd:2.3, range:168, color:"#8b949a", ap:0.5, tip:"long range, AP"},
  missile:{name:"MISSILE POD", cost:520, dmg:34, cd:1.7, range:135, color:"#9a4a44", splash:30, tip:"splash damage"},
  tesla:  {name:"TESLA COIL",  cost:720, dmg:16, cd:1.05,range:92,  color:"#4fa3c7", chain:4, tip:"chains 4 zeds"},
};
const TYPES=Object.keys(TDEF);
const MAXLVL=12;

const OPS={
  fund:    {name:"COMMAND FUND",  cost:80,  mult:1.42, tip:"+0.8 $/s per lvl"},
  muni:    {name:"MUNITIONS LAB", cost:150, mult:1.5,  tip:"+6% dmg / lvl"},
  robotics:{name:"ROBOTICS BAY",  cost:200, mult:1.5,  tip:"+4% fire rate / lvl"},
  optics:  {name:"OPTICS DIVISION", cost:180, mult:1.46, tip:"+3% range, +2% crit"},
  salvage: {name:"SALVAGE CREW",  cost:120, mult:1.42, tip:"+5% kill gold / lvl"},
};

const ZDEF={
  walker: {hp:16,  spd:15,  gold:6,   life:1, iv:0.85, skin:"#7fae52", dark:"#4a7031", shirt:"#5f5a4a"},
  runner: {hp:11,  spd:34,  gold:7,   life:1, iv:0.6,  skin:"#8fbc5a", dark:"#557e33", shirt:"#a05a2a"},
  brute:  {hp:90,  spd:8.5, gold:24,  life:2, iv:1.7,  skin:"#648a36", dark:"#37541e", shirt:"#4a3a30", big:1.6},
  armored:{hp:46,  spd:11,  gold:18,  life:2, iv:1.15, skin:"#7fae52", dark:"#4a7031", shirt:"#5a6672", armor:1},
  boss:   {hp:900, spd:7,   gold:150, life:5, iv:3.5,  skin:"#3f6e2c", dark:"#24411a", shirt:"#3a2c3c", big:2.2},
};

/* waypoints in cell coords -> pixel centers; exit off right edge */
const WPC=[[0,3],[6,3],[6,7],[2,7],[2,11],[10,11],[10,5],[14,5],[14,11],[20,11]];
const WPTS=WPC.map(([c,r])=>[c*CELL+8,r*CELL+8]);
WPTS[WPTS.length-1][0]+=24; // walk off-map

/* ============ ROAD (single source of truth) ============ */
/* Walk segments in CELL space; produce ordered road cell list. Deterministic,
   used for BOTH terrain painting and build rules. */
const roadCR=new Set();
for(let i=0;i<WPC.length-1;i++){
  const [c1,r1]=WPC[i],[c2,r2]=WPC[i+1];
  const dc=Math.sign(c2-c1), dr=Math.sign(r2-r1);
  let c=c1, r=r1;
  roadCR.add(c+","+r);
  while(c!==c2||r!==r2){
    if(c!==c2)c+=dc; else r+=dr;
    roadCR.add(c+","+r);
  }
}
const isRoadCell=(c,r)=>roadCR.has(c+","+r);

/* ============ SPRITES (hand-built pixel maps) ============ */
/* zombie: 14x15 body, 3 walk frames; chars:
   k outline | g skin | G skin light | d skin dark | e eye | j jaw/teeth
   s shirt | S shirt dark | h hand | r ready-to-use spare */
const ZHEAD=[
"....kkkkkk....",
"...kgGGGGgk...",
"..kgGgGGgGgk..",
"..kgeekgeek...",
"..kgdddggdk...",
"...kgggggk....",
"....kggggk...."];
const ZBODY=[
"...kssssssk...",
"..ksshAAAhhk..",
"..kSshAAAhhk..",
"..ksksssssk...",
"...kssssSsk...",
"....kssSSk....",
".....kssk....."];
/* legs: 3-stride cycle, each 5 rows tall */
const ZLEGS=[
[ // A: together
"...kpkkpk.....",
"...kpk.kpk....",
"...kd...kdk...",
"...kd..dkdk...",
"..kkk..kkkk..."],
[ // B: left forward
"..kppk.kpk....",
".kppk..kpk....",
".kdk...kd.k...",
"kkdk...kdk....",
"kkk...kkkk...."],
[ // C: right forward
"...kpk.kppk...",
"...kpk..kppk..",
"..kd.k...kdk..",
".kdk....kkdk..",
"kkk.....kkk..."]];
const ZSPR={};
function bakeZombie(t){
  const d=ZDEF[t];
  ZSPR[t]=[0,1,2].map(idx=>{
    const c=document.createElement("canvas"); c.width=16;c.height=20;
    const g=c.getContext("2d");
    const put=(map,oy)=>{
      for(let y=0;y<map.length;y++)for(let x=0;x<map[y].length;x++){
        const ch=map[y][x]; if(ch===".")continue;
        let col=
          ch==="k"?d.dark :
          ch==="g"?d.skin :
          ch==="G"?shade(d.skin,18) :
          ch==="d"?shade(d.skin,-26) :
          ch==="e"?"#e0392b" :
          ch==="s"?d.shirt :
          ch==="S"?shade(d.shirt,-22) :
          ch==="A"?"#c9c27a" :
          ch==="h"?shade("#c9c27a",-24) :
          ch==="p"?d.dark : d.skin;
        if(t==="boss"&&ch==="e")col="#ff6a1e";
        g.fillStyle=col;
        g.fillRect(1+x,1+oy+y,1,1);
      }
    };
    put(ZHEAD,0);
    put(ZBODY,ZHEAD.length);
    put(ZLEGS[idx],ZHEAD.length+ZBODY.length);
    if(t==="armored"){
      g.fillStyle="#c7d3da"; g.fillRect(5,2,7,2); g.fillRect(4,3,9,2);
      g.fillStyle="#8b98a1"; g.fillRect(5,4,7,2);
      g.fillStyle="#4b545b"; g.fillRect(9,3,2,2);           // visor slit
      g.fillStyle="#8b98a1"; g.fillRect(3,7,12,3);           // chest plate
      g.fillStyle="#c7d3da"; g.fillRect(4,7,10,1);
    }
    if(t==="boss"){
      g.fillStyle="#e8c53e"; g.fillRect(4,0,9,3);
      g.fillStyle="#a84a2c"; g.fillRect(5,0,2,2); g.fillRect(8,0,2,2); g.fillRect(11,0,2,2);
      g.fillStyle="#fff3b0"; g.fillRect(4,0,1,3); g.fillRect(12,0,1,3);
    }
    if(t==="brute"){ // shoulder pads
      g.fillStyle=d.dark;
      g.fillRect(1,8,4,3); g.fillRect(12,8,3,3);
    }
    return c;
  });
}
/* tiny color shade helper */
function shade(hex,p){
  const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const cl=v=>Math.max(0,Math.min(255,v));
  return "#"+((cl(r+p)<<16)|(cl(g+p)<<8)|cl(b+p)).toString(16).padStart(6,"0");
}
Object.keys(ZDEF).forEach(bakeZombie);

/* turret bases: unique 16x16 pixel maps per type.
   . empty | k dark | b metal | B metal-light | x type-accent | X accent-dark | w light */
const BASEMAPS={
rife: null,
rifle:[
"....kkkkkkkk....",
"...kxxxxxxxxxk..",
"..kxBBBBBBBBxxk.",
".kxBkkkkkkkBxxxk",
".kxkkxxxxxxkkxxk",
"kxBkxBBBBBBkxxxx",
"kxkkxBkkkkBkxktk",
"kxkxkxxxxxxkxxkk",
"kxkxkxkkkkxkxxxk",
"kxkkxBBBBBBkxxxk",
".kxBkxxxxxkxxxxk",
".kxkkxBkkBkxxxxx",
".kxkxBBBBBkxxxxk",
"..kxkxxxxkxxxxxk",
".kxxxxxxxxxxxxk.",
"..kkkkkkkkkkkk.."],
shotgun:[
"..kkkkkkkkkkkk..",
".kbbbbbbbbbbbbk.",
"kbbkkkkkkkkkkbbk",
"kbkxxxxxxxxxxkbk",
"kbkxBBBBBBBBxkbk",
"kbkxBkkkkkkBxkbk",
"kbkxkxxxxxxkxkbk",
"kbkxkXXXXXXkxkbk",
"kbkxkxxxxxxkxkbk",
"kbkxBBBBBBBBxkbk",
"kbkxxxxxxxxxxkbk",
"kbkkkkkkkkkkkkbk",
"kbbkbbbbbbbbkbbk",
"kbkbbbbbbbbbbkbk",
"kbkbbbbbbbbbbkbk",
".kkkkkkkkkkkkkk."],
flame:[
"...kkkkkkkkkk...",
"..kbbbbbbbbbbk..",
".kbkkkkkkkkkkbk.",
".kbkxxxxxxxxkbk.",
"kbkkxBBBBBBxkkbk",
"kbkxxBXXXXBxxkbk",
"kbkxxBkkkkBxxkbk",
"kbkxxBxxxxBxxkbk",
"kbkxxBxxxxBxxkbk",
"kbkxxBXXXXBxxkbk",
"kbkkxBBBBBBxkkbk",
".kbkxxxxxxxxkbk.",
".kbkkkkkkkkkkbk.",
".kbbkbbbbbbkbbk.",
"..kbbbbbbbbbbk..",
"...kkkkkkkkkk..."],
sniper:[
"......kxxk......",
".....kxxxxk.....",
"....kxBxxBxk....",
"...kkxxxxxxxxkk.",
"..kxxxBBBBxxxxxk",
".kxxxxBkkkxxxxxx",
"kxxxxxBkkkxxxxxx",
"kxxxxxBBBBxxxxxx",
"kxxxxxxxBBxxxxxx",
"kxxxxxxxxxxxxxxk",
"kxxxxxxxxxxxxxxk",
"kxxxxkkkkkxxxxxk",
".kxxxkbbbkxxxxxk",
".kxxkbbbbbkbxxk.",
"..kbbbobbkkxxxk.",
"...kkbbkkkkkk..."],
missile:[
"..kkkkkkkkkkkk..",
".kbbbbbbbbbbbbk.",
"kbbkxxxxxxxxxbbk",
"kbkxxxxxxxxxxkbk",
"kbkxwwxwwxwwxkbk",
"kbkxwwxwwxwwxkbk",
"kbkxxxxxxxxxxkbk",
"kbkxxwxxxxwxxkbk",
"kbkxxxxkkxxxxkbk",
"kbkxxwxxxxwxxkbk",
"kbkxxxxxxxxxxkbk",
"kbkkkkkkkkkkkkbk",
"kbbkbbbbbbbbkbbk",
"kbkbbbbbbbbbbkbk",
"kbkbbbbbbbbbbkbk",
".kkkkkkkkkkkkkk."],
tesla:[
"......kkkk......",
".....kBBBBk.....",
"....kBBxxBBk....",
"....kBxxxxBk....",
"...kkxBkkxBkk...",
"..kbbkkxxxxkkbbk",
".kbbbkxxxxkbbbk.",
".kbbkxwwwwxkbbk.",
".kbbkxxxxxxkbbk.",
"kbkkxxxxxxxxkbkk",
"kbkxxwkkkkwxkbbk",
"kbkxwwwwwwwwxkbk",
"kbbkxxxxxxxxkbbk",
".kbbkbbbbbbkbbk.",
"..kbbbbbbbbbbk..",
"...kkkkkkkkkk..."],
};
delete BASEMAPS.rife;
const BASES={};
function bakeBase(t){
  const map=BASEMAPS[t], d=TDEF[t];
  const c=document.createElement("canvas"); c.width=16;c.height=16;
  const g=c.getContext("2d");
  const PAL={k:"#191d20", b:"#3c4349", B:"#4d555c", x:d.color, X:"#20282c", w:"#dfe8ec"};
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const ch=map[y][x]; if(ch==="."||PAL[ch]===undefined)continue;
    g.fillStyle=PAL[ch]; g.fillRect(x,y,1,1);
  }
  // bevel shading pass: lighter top-left, darker bottom-right for volume
  const img=g.getImageData(0,0,16,16),dd=img.data;
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const i=(y*16+x)*4; if(dd[i+3]===0)continue;
    let delta=((8-x)+(8-y))*2.4;                 // + top-left, − bottom-right
    delta=Math.max(-30,Math.min(26,delta));
    if(PAL[map[y][x]]==="#191d20")delta*=0.35;    // keep outlines dark
    dd[i]=Math.max(0,Math.min(255,dd[i]+delta));
    dd[i+1]=Math.max(0,Math.min(255,dd[i+1]+delta));
    dd[i+2]=Math.max(0,Math.min(255,dd[i+2]+delta));
  }
  g.putImageData(img,0,0);
  BASES[t]=c;
}
Object.keys(BASEMAPS).forEach(bakeBase);

/* other props */
function bakeRect(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"));return c;}
const HQ=bakeRect(28,26,g=>{ // bunker at exit
  g.fillStyle="#20262a"; g.fillRect(0,4,28,22);
  g.fillStyle="#39424a"; g.fillRect(2,6,24,18);
  g.fillStyle="#2b3339"; g.fillRect(4,12,10,12); // door
  g.fillStyle="#17191c"; g.fillRect(5,14,8,10);
  g.fillStyle="#4a545c"; g.fillRect(0,4,28,3); g.fillRect(0,2,28,2);
  g.fillStyle="#c9463c"; g.fillRect(3,3,4,2); g.fillRect(21,3,4,2);
  g.fillStyle="#7d8b92"; g.fillRect(16,9,8,4); // monitor slit
  g.fillStyle="#9fd7ff"; g.fillRect(17,10,6,2);
});
const GRAVE=bakeRect(22,22,g=>{ // spawn graveyard
  g.fillStyle="#20262a"; g.fillRect(0,10,22,12);
  g.fillStyle="#39424a"; g.fillRect(1,11,20,11);
  [[3,4],[10,2],[16,6]].forEach(([x,h])=>{ // tombstones
    g.fillStyle="#5b6067"; g.fillRect(x,16-h,4,h+2);
    g.fillStyle="#454b52"; g.fillRect(x+1,15-h,2,h+2);
    g.fillStyle="#2b2f33"; g.fillRect(x+1,19-h,2,2);
  });
  g.fillStyle="#37543a"; g.fillRect(2,20,3,1); g.fillRect(7,21,2,1); g.fillRect(14,20,4,1);
});

/* ============ TERRAIN RENDER (deterministic) ============ */
const bgC=document.createElement("canvas"); bgC.width=W; bgC.height=H;
(function paintTerrain(){
  const g=bgC.getContext("2d");
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    g.fillStyle=(c+r)%2? "#1a1f22":"#1d2326";
    g.fillRect(c*CELL,r*CELL,CELL,CELL);
    g.fillStyle="#16191b"; g.fillRect(c*CELL,r*CELL,CELL,1); g.fillRect(c*CELL,r*CELL,1,CELL);
    if(!isRoadCell(c,r)){
      if((c*7+r*13)%23===0){ g.fillStyle="#37543a"; g.fillRect(c*CELL+((c*5+r)%9+3),r*CELL+((c*3+r*7)%9+3),2,1); }
      if((c*11+r*5)%31===0){ g.fillStyle="#141719"; g.fillRect(c*CELL+((c*7+r)%8+4),r*CELL+((c*5+r*3)%8+4),2,2); }
    }
  }
  // road cells (from roadCR — same source as build rules)
  for(const key of roadCR){
    const [c,r]=key.split(",").map(Number);
    g.fillStyle="#3b4145"; g.fillRect(c*CELL,r*CELL,CELL,CELL);
    g.fillStyle="#2a2f32";
    g.fillRect(c*CELL,r*CELL,CELL,2); g.fillRect(c*CELL,r*CELL+14,CELL,2);
    if((c+r)%4<2){ g.fillStyle="#565c60"; g.fillRect(c*CELL+3,r*CELL+7,4,2); g.fillRect(c*CELL+10,r*CELL+7,4,2); }
  }
  // road-side props: blood stains near spawn
  g.fillStyle="rgba(90,26,20,.5)";
  [[14,52],[30,58],[46,50],[22,180],[10,172]].forEach(([x,y])=>{g.fillRect(x,y,4,2);g.fillRect(x+3,y+1,3,1);});
  g.drawImage(GRAVE,0,44);
  g.drawImage(HQ,W-30,140);
  // subtle vignette for depth
  const vg=g.createRadialGradient(W/2,H/2-8,H*0.42,W/2,H/2-8,W*0.72);
  vg.addColorStop(0,"rgba(0,0,0,0)");
  vg.addColorStop(1,"rgba(4,6,8,0.30)");
  g.fillStyle=vg; g.fillRect(0,0,W,H);
})();

/* path follow helpers */
const segLen=[]; let total=0;
for(let i=0;i<WPTS.length-1;i++){ const l=Math.hypot(WPTS[i+1][0]-WPTS[i][0],WPTS[i+1][1]-WPTS[i][1]); segLen.push(l); total+=l; }
function pointAt(d){
  let i=0; while(i<segLen.length-1&&d>segLen[i]){d-=segLen[i];i++;}
  const a=WPTS[i],b=WPTS[i+1],t=Math.min(1,d/segLen[i]);
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
}

/* ============ STATE ============ */
let S={gold:200, wave:0, best:1, lives:20, kills:0,
  ops:{fund:0,muni:0,robotics:0,optics:0,salvage:0},
  towers:[], ts:Date.now(), auto:true, speed:1, paused:false};
let enemies=[], shots=[], fx=[], parts=[], floats=[];
let spawnQueue=[], spawnT=0, inWave=false, betweenT=6, hpMult=1;
let buildSel=null, selTower=null, tab="build";
let flashBase=0;
let lastTick=performance.now();
const $=id=>document.getElementById(id);

function gps(){return 0.5+0.8*S.ops.fund;}
function muni(){return 1+0.06*S.ops.muni;}
function rateM(){return 1+0.04*S.ops.robotics;}
function opticsM(){return 1+0.03*S.ops.optics;}
function critC(){return 0.02+0.02*S.ops.optics;}
function salvageM(){return 1+0.05*S.ops.salvage;}

function towerStats(tw){
  const d=TDEF[tw.t], L=tw.lvl;
  return {
    dmg:d.dmg*Math.pow(1.30,L)*muni(),
    cd:d.cd*Math.pow(0.96,L)/rateM(),
    range:d.range*Math.pow(1.05,L)*opticsM(),
    splash:d.splash? d.splash*(1+0.04*L):0,
    burn:d.burn? d.burn*Math.pow(1.25,L):0,
    chain:d.chain||0, ap:d.ap||0, multi:d.multi||0
  };
}
const upgCost=tw=>Math.round(TDEF[tw.t].cost*0.75*Math.pow(1.5,tw.lvl));
const opsCost=k=>Math.round(OPS[k].cost*Math.pow(OPS[k].mult,S.ops[k]));

/* ============ SAVE ============ */
function save(){S.ts=Date.now(); try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
let offlineShown=false;
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw)return;
    const d=JSON.parse(raw);
    S=Object.assign(S,d); S.ops=Object.assign({fund:0,muni:0,robotics:0,optics:0,salvage:0},d.ops);
    S.towers=(d.towers||[]).map(t=>Object.assign({cool:0,ang:0,flash:0},t));
    const gone=Math.min((Date.now()-d.ts)/1000, 8*3600);
    if(gone>120){
      const earn=Math.floor(gps()*gone*0.5);
      if(earn>0){S.gold+=earn;
        const h=Math.floor(gone/3600), m=Math.floor(gone%3600/60);
        if(!offlineShown){offlineShown=true;
          $("modalMsg").textContent=`The Command Fund produced $${earn} while you were away (${h?h+"h ":""}${m}m). The watch never stops.`;
          $("modal").style.display="flex";}
      }
    }
  }catch(e){}
}
$("modalBtn").onclick=()=>$("modal").style.display="none";

/* ============ WAVES ============ */
function startWave(){
  S.wave++; if(S.wave>S.best)S.best=S.wave;
  hpMult=Math.pow(1.22,S.wave-1);
  spawnQueue=[];
  const n=Math.round(6+S.wave*1.5);
  for(let i=0;i<n;i++){
    const r=Math.random(); let t="walker";
    if(S.wave>=8&&r<0.14)t="brute";
    else if(S.wave>=6&&r<0.32)t="armored";
    else if(S.wave>=4&&r<0.55)t="runner";
    spawnQueue.push(t);
  }
  if(S.wave%5===0)spawnQueue.push("boss");
  spawnT=0.4; inWave=true;
  log(`WAVE ${S.wave}: ${spawnQueue.includes("boss")?"BOSS INCOMING! ":""}${spawnQueue.length} hostiles.`);
  renderSub();
}
function waveDone(){
  const bonus=Math.round(12+8*S.wave);
  S.gold+=bonus; inWave=false; betweenT=12;
  log(`Wave cleared. Salvage bonus $${bonus}.`);
  save(); renderSub();
}
function spawn(type){
  const d=ZDEF[type];
  enemies.push({type,dist:-Math.random()*14,hp:d.hp*hpMult,maxhp:d.hp*hpMult,spd:d.spd,
    gold:Math.round(d.gold*Math.pow(1.06,S.wave-1)),burn:0,burnT:0,ph:Math.random()*6,
    armor:d.armor?3+0.25*S.wave:0,flash:0,big:d.big||1,dead:false,x:WPTS[0][0],y:WPTS[0][1]});
}

/* ============ COMBAT ============ */
function hurt(e,dmg,ap,burnDps){
  if(e.dead)return;
  let d=dmg;
  if(Math.random()<critC()){d*=2.5; addFloat(e.x,e.y-10,"CRIT!","#ffce4a");}
  if(e.armor&&ap<1)d=Math.max(1,d-e.armor*(1-ap));
  e.hp-=d; e.flash=0.08;
  if(burnDps){e.burn=Math.max(e.burn,burnDps); e.burnT=2.5;}
  if(e.hp<=0)kill(e);
}
function kill(e){
  if(e.dead)return;
  e.dead=true; S.kills++;
  const g=Math.round(e.gold*salvageM()); S.gold+=g;
  addFloat(e.x,e.y-10,"+$"+g,"#e8b93e");
  for(let i=0;i<(e.big>1.5?16:8);i++)parts.push({x:e.x,y:e.y-4,vx:(Math.random()-.5)*70,vy:-Math.random()*60,t:.5+Math.random()*.4,
    col:Math.random()<.5?ZDEF[e.type].dark:"#5a2a22"});
}
function addFloat(x,y,txt,col){floats.push({x,y,txt,col,t:1});}
const logEl=$("log"); let logs=[];
function log(m){logs.unshift(new Date().toTimeString().slice(0,5)+" "+m); logs=logs.slice(0,2);
  logEl.innerHTML=logs.map((s,i)=>`<div${i===0?' class="new"':''}>${s}</div>`).join("");}

function fire(tw,st){
  const tx=tw.c*CELL+8, ty=tw.r*CELL+8;
  let best=null,bd=-1;
  for(const e of enemies){if(e.dead)continue;
    const d2=(e.x-tx)**2+(e.y-ty)**2;
    if(d2<=st.range*st.range&&e.dist>bd){bd=e.dist;best=e;}
  }
  if(!best){tw.cool=0.15;return;}
  tw.ang=Math.atan2(best.y-ty,best.x-tx);
  tw.cool=st.cd; tw.flash=0.08;
  if(tw.t==="sniper"){
    fx.push({k:"line",x1:tx+Math.cos(tw.ang)*10,y1:ty+Math.sin(tw.ang)*10,x2:best.x,y2:best.y,t:.12,col:"#fff8d0"});
    hurt(best,st.dmg,st.ap,0);
  } else if(tw.t==="tesla"){
    let cur=best,hit=new Set([best]),px=tx+Math.cos(tw.ang)*8,py=ty+Math.sin(tw.ang)*8;
    for(let i=0;i<st.chain&&cur;i++){
      fx.push({k:"zap",x1:px,y1:py,x2:cur.x,y2:cur.y,t:.14});
      hurt(cur,st.dmg*Math.pow(0.7,i),0,0);
      px=cur.x;py=cur.y;
      let nx=null,nd=64*64;
      for(const e of enemies){if(e.dead||hit.has(e))continue;const d2=(e.x-px)**2+(e.y-py)**2;if(d2<nd){nd=d2;nx=e;}}
      hit.add(nx);cur=nx;
    }
  } else if(tw.t==="flame"){
    const ca=Math.cos(tw.ang),sa=Math.sin(tw.ang);
    for(const e of enemies){if(e.dead)continue;
      const dx=e.x-tx,dy=e.y-ty,d2=dx*dx+dy*dy;
      if(d2>st.range*st.range)continue;
      const dot=(dx*ca+dy*sa)/Math.sqrt(d2+0.01);
      if(dot>0.3||d2<18*18)hurt(e,st.dmg,0,st.burn);
    }
    for(let i=0;i<3;i++)parts.push({x:tx+ca*9,y:ty+sa*9,vx:ca*(45+Math.random()*35)+(Math.random()-.5)*30,
      vy:sa*(45+Math.random()*35)+(Math.random()-.5)*30,t:.28+Math.random()*.2,
      col:Math.random()<.5?"#ff8a2c":"#ffc23e",flamep:1});
  } else if(tw.t==="shotgun"){
    fx.push({k:"puff",x:tx+Math.cos(tw.ang)*10,y:ty+Math.sin(tw.ang)*10,t:.08});
    const targets=enemies.filter(e=>!e.dead&&(e.x-tx)**2+(e.y-ty)**2<=st.range*st.range)
      .sort((a,b)=>((a.x-tx)**2+(a.y-ty)**2)-((b.x-tx)**2+(b.y-ty)**2));
    targets.slice(0,st.multi).forEach(e=>hurt(e,st.dmg,0,0));
  } else if(tw.t==="missile"){
    shots.push({k:"rocket",x:tx,y:ty,vx:Math.cos(tw.ang)*95,vy:Math.sin(tw.ang)*95,tgt:best,dmg:st.dmg,sp:st.splash,life:2.5});
  } else {
    shots.push({k:"bullet",x:tx,y:ty,vx:Math.cos(tw.ang)*230,vy:Math.sin(tw.ang)*230,dmg:st.dmg,life:1.2});
  }
}

/* ============ UPDATE ============ */
function update(dt){
  S.gold+=gps()*dt;
  if(inWave){
    if(spawnQueue.length){
      spawnT-=dt;
      if(spawnT<=0){const t=spawnQueue.shift();spawn(t);spawnT=spawnQueue.length?ZDEF[spawnQueue[0]].iv:0.3;}
    } else if(enemies.length===0)waveDone();
    renderTimer();
  } else {
    betweenT-=dt;
    if(S.auto&&betweenT<=0)startWave();
    renderTimer();
  }
  for(const e of enemies){
    if(e.dead)continue;
    if(e.burnT>0){e.burnT-=dt;e.hp-=e.burn*dt;
      if(Math.random()<dt*10)parts.push({x:e.x+(Math.random()*8-4),y:e.y-4+(Math.random()*6-3),vx:0,vy:-16,t:.3,col:Math.random()<.5?"#ff8a2c":ZDEF[e.type].shirt,flamep:1});
      if(e.hp<=0){kill(e);continue;}}
    e.dist+=e.spd*dt;
    const p=pointAt(Math.max(0,e.dist));
    e.x=p[0]; e.y=p[1]+Math.sin(e.ph+performance.now()/300)*(e.big>1.4?0:0.8);
    if(e.dist>=total){
      e.dead=true; S.lives-=e.big>2?4:(e.big>1.4?2:1);
      addFloat(W-18,e.y,"-"+(e.big>2?4:(e.big>1.4?2:1)),"#e05a4a"); flashBase=0.4;
      if(S.lives<=0)overrun();
    }
    if(e.flash>0)e.flash-=dt;
  }
  enemies=enemies.filter(e=>!e.dead);
  for(const tw of S.towers){
    const st=towerStats(tw);
    if(tw.flash>0)tw.flash-=dt;
    if(tw.cool>0)tw.cool-=dt;
    else fire(tw,st);
  }
  for(const s of shots){
    s.life-=dt;
    if(s.tgt&&!s.tgt.dead){const dx=s.tgt.x-s.x,dy=s.tgt.y-s.y,dl=Math.hypot(dx,dy)||1;
      const sp=s.k==="rocket"?115:230;s.vx=dx/dl*sp;s.vy=dy/dl*sp;}
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.k==="rocket"&&Math.random()<dt*35)parts.push({x:s.x,y:s.y,vx:0,vy:-12,t:.2,col:"#8a5a2a"});
    let boom=false;
    for(const e of enemies){if(e.dead)continue;
      if((e.x-s.x)**2+(e.y-s.y)**2<(e.big>1.5?7:6)**2){boom=true;if(s.k!=="rocket")hurt(e,s.dmg,0,0);break;}}
    if(boom||s.life<=0){
      s.dead=true;
      if(s.k==="rocket"){
        fx.push({k:"ring",x:s.x,y:s.y,max:s.sp,t:.25});
        for(let i=0;i<6;i++)parts.push({x:s.x,y:s.y,vx:(Math.random()-.5)*150,vy:-Math.random()*90,t:.4+Math.random()*.3,col:Math.random()<.5?"#ffd24a":"#5a4a3a"});
        for(let i=0;i<3;i++)parts.push({x:s.x,y:s.y-2,vx:(Math.random()-.5)*20,vy:-24-Math.random()*16,t:.7,col:"rgba(120,110,100,.5)"});
        for(const e of enemies){if(e.dead)continue;const d2=(e.x-s.x)**2+(e.y-s.y)**2;
          if(d2<s.sp*s.sp)hurt(e,s.dmg*(1-Math.sqrt(d2)/s.sp*0.5),0,0);}
      } else if(boom)fx.push({k:"puff",x:s.x,y:s.y,t:.06});
    }
  }
  shots=shots.filter(s=>!s.dead);
  for(const f of fx)f.t-=dt; fx=fx.filter(f=>f.t>0);
  for(const p of parts){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.flamep?-(20+Math.random()*30):170*dt;}
  parts=parts.filter(p=>p.t>0);
  for(const f of floats){f.t-=dt;f.y-=14*dt;} floats=floats.filter(f=>f.t>0);
  if(flashBase>0)flashBase-=dt;
}
function overrun(){
  S.lives=10; S.wave=Math.max(1,S.wave-3); S.gold=Math.floor(S.gold*0.8);
  banner("OVERRUN! Rolled back 3 waves, kept 10 lives"); log("BASE OVERRUN. Holding position at wave "+S.wave+".");
  enemies.forEach(e=>e.dead=true); spawnQueue=[]; inWave=false; betweenT=12;
  save(); renderSub();
}
function banner(txt){
  const b=$("banner"); b.textContent=txt; b.style.color="#e05a4a";
  b.style.left="36px"; b.style.top="100px";
  let t=0; const iv=setInterval(()=>{t+=0.1;b.style.opacity=t<2?1:Math.max(0,1-(t-2)*2);if(t>2.6){clearInterval(iv);b.style.opacity=0;}},100);
}

/* ============ RENDER ============ */
const ctx=$("game").getContext("2d");
ctx.scale(2,2); ctx.imageSmoothingEnabled=false;
let mouse=null;
function render(){
  ctx.drawImage(bgC,0,0);
  if(buildSel&&mouse){
    const c=mouse[0]/CELL|0,r=mouse[1]/CELL|0;
    if(c>=0&&c<COLS&&r>=0&&r<ROWS){
      ctx.fillStyle=isRoadCell(c,r)||occupied(c,r)?"rgba(200,60,50,.4)":"rgba(110,170,80,.4)";
      ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
    }
  }
  const tws=[...S.towers].sort((a,b)=>a.r-b.r);
  for(const tw of tws){
    const bx=tw.c*CELL, by=tw.r*CELL, cx=bx+8, cy=by+8;
    ctx.drawImage(BASES[tw.t],bx,by);
    const bl=tw.t==="sniper"?9: tw.t==="missile"?6: tw.t==="flame"?5: tw.t==="tesla"?0:7;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(tw.ang||0);
    if(tw.t==="tesla"){
      // charge orb grows between shots, pops on fire
      const st2=towerStats(tw);
      const chg=st2.cd>0?Math.max(0,Math.min(1,1-tw.cool/st2.cd)):.9;
      const r=1.6+1.6*chg+(tw.flash>0?2:0);
      ctx.fillStyle="rgba(79,163,199,.35)"; ctx.beginPath(); ctx.arc(0,0,r+2,0,7); ctx.fill();
      ctx.fillStyle="#4fa3c7"; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
      ctx.fillStyle="#bfeaff"; ctx.beginPath(); ctx.arc(-r*0.25,-r*0.25,r*0.4,0,7); ctx.fill();
    }else{
      ctx.fillStyle="#191d20"; ctx.fillRect(2,-2,bl,3);
      ctx.fillStyle=TDEF[tw.t].color; ctx.fillRect(2,-1,bl-2,1);
      ctx.fillStyle=shade(TDEF[tw.t].color,45); ctx.fillRect(2,-2,Math.max(1,bl-3),1);
      if(tw.flash>0){
        ctx.fillStyle="#fff6c8"; ctx.beginPath(); ctx.arc(2+bl+1,0,2.4,0,7); ctx.fill();
        ctx.fillStyle="#ffb34a"; ctx.beginPath(); ctx.arc(2+bl+1,0,1.2,0,7); ctx.fill();
      }
    }
    ctx.restore();
    if(tw===selTower){
      ctx.strokeStyle="#e8b93e"; ctx.strokeRect(bx+0.5,by+0.5,15,15);
      ctx.strokeStyle="rgba(232,185,62,.25)";
      ctx.beginPath(); ctx.arc(cx,cy,towerStats(tw).range,0,7); ctx.stroke();
    }
    if(tw.lvl>0){ctx.fillStyle="#e8b93e";for(let i=0;i<Math.min(tw.lvl,6);i++)ctx.fillRect(bx+3+i*2,by+13,1,2);}
  }
  for(const e of enemies){
    if(e.dead)continue;
    const d=ZDEF[e.type],sc=e.big,w=16*sc,h=20*sc;
    const fi=Math.floor(performance.now()/150+e.ph*3)%3;
    const spr=ZSPR[e.type][fi];
    const bob=fi===1?-1*sc:(fi===2?-0.5*sc:0);
    // ground shadow
    ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(e.x-5*sc,e.y+6*sc,10*sc,2);
    ctx.drawImage(spr,e.x-w/2,e.y-h/2-2*sc+bob,w,h);
    if(e.flash>0){ctx.globalAlpha=.65;ctx.globalCompositeOperation="lighter";ctx.drawImage(spr,e.x-w/2,e.y-h/2-2*sc+bob,w,h);ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;}
    if(e.hp<e.maxhp){
      ctx.fillStyle="#120c08"; ctx.fillRect(e.x-7,e.y-h/2-5,14,3);
      ctx.fillStyle="#5a1c14"; ctx.fillRect(e.x-6,e.y-h/2-4,12,1);
      ctx.fillStyle=e.hp/e.maxhp>.5?"#7cc14e":(e.hp/e.maxhp>.25?"#e8b93e":"#c9463c");
      ctx.fillRect(e.x-6,e.y-h/2-4,12*Math.max(0,e.hp/e.maxhp),1);
    }
  }
  for(const s of shots){ctx.fillStyle=s.k==="rocket"?"#ffd24a":"#ffe9a8";ctx.fillRect(s.x-1,s.y-1,2,2);}
  for(const f of fx){
    if(f.k==="line"){
      ctx.globalAlpha=.3; ctx.strokeStyle="#ffdf8a"; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); ctx.stroke();
      ctx.globalAlpha=1; ctx.strokeStyle=f.col; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); ctx.stroke(); ctx.lineWidth=1;
    }
    else if(f.k==="zap"){
      ctx.globalAlpha=.30; ctx.strokeStyle="#6fc4ef"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(f.x1,f.y1);
      for(let i=1;i<=3;i++){const t=i/3;ctx.lineTo(f.x1+(f.x2-f.x1)*t+(i<3?(Math.random()*6-3):0),f.y1+(f.y2-f.y1)*t+(i<3?(Math.random()*6-3):0));}
      ctx.stroke();
      ctx.globalAlpha=1; ctx.strokeStyle="#d8f4ff"; ctx.lineWidth=1; ctx.stroke();
      ctx.globalAlpha=.18; ctx.fillStyle="#9fd7ff"; ctx.beginPath(); ctx.arc(f.x2,f.y2,4,0,7); ctx.fill(); ctx.globalAlpha=1; ctx.lineWidth=1;
    }
    else if(f.k==="ring"){
      const p=1-f.t/0.25, r=p*f.max;
      ctx.strokeStyle="rgba(255,190,70,"+(f.t/0.25)+")"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(f.x,f.y,r,0,7); ctx.stroke();
      ctx.strokeStyle="rgba(255,240,200,"+Math.max(0,f.t/0.25-0.2)+")"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(f.x,f.y,r*0.6,0,7); ctx.stroke(); ctx.lineWidth=1;
    }
    else if(f.k==="puff"){
      ctx.globalAlpha=Math.max(0,f.t*8); ctx.fillStyle="#fff0d0";
      ctx.beginPath(); ctx.arc(f.x,f.y,3.5,0,7); ctx.fill(); ctx.globalAlpha=1;
    }
  }
  for(const p of parts){
    ctx.globalAlpha=Math.min(1,p.t*3);
    if(p.flamep)ctx.globalCompositeOperation="lighter";
    ctx.fillStyle=p.col; ctx.fillRect(p.x|0,p.y|0,1,1);
    ctx.globalCompositeOperation="source-over";
  }
  ctx.globalAlpha=1;
  ctx.font="7px monospace"; ctx.textAlign="center";
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.t*2);
    ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillText(f.txt,f.x+1,f.y+1);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
  if(flashBase>0){ctx.fillStyle="rgba(180,40,30,"+flashBase*0.25+")";ctx.fillRect(0,0,W,H);}
}

/* ============ UI ============ */
$("game").addEventListener("mousemove",ev=>{
  const r=$("game").getBoundingClientRect();
  mouse=[(ev.clientX-r.left)*(W/r.width),(ev.clientY-r.top)*(H/r.height)];
});
$("game").addEventListener("mouseleave",()=>mouse=null);
$("game").addEventListener("click",ev=>{
  const r=$("game").getBoundingClientRect();
  const x=(ev.clientX-r.left)*(W/r.width),y=(ev.clientY-r.top)*(H/r.height);
  const c=x/CELL|0,rr=y/CELL|0;
  if(buildSel){
    if(isRoadCell(c,rr)){log("Can't build on the road.");return;}
    if(occupied(c,rr)){log("Occupied.");return;}
    const def=TDEF[buildSel];
    if(S.gold<def.cost){log("Not enough gold.");return;}
    S.gold-=def.cost;
    S.towers.push({t:buildSel,c,r:rr,lvl:0,spent:def.cost,cool:0,ang:0,flash:0});
    log(def.name+" deployed ["+c+","+rr+"].");
    selTower=S.towers[S.towers.length-1];
    setTab("upg");
    renderAll();return;
  }
  selTower=S.towers.find(t=>t.c===c&&t.r===rr)||null;
  setTab(selTower?"upg":tab);
});
const occupied=(c,r)=>S.towers.some(t=>t.c===c&&t.r===r);

document.addEventListener("keydown",ev=>{
  if(ev.repeat)return;
  const k=ev.key.toLowerCase();
  if(k>="1"&&k<="6")setBuild(TYPES[+k-1]);
  if(k==="0"||ev.key==="Escape")setBuild(null);
  if(k==="u"&&selTower)doUpgrade();
  if(k==="s"&&selTower)doSell();
  if(k==="n"&&!inWave)startWave();
  if(ev.code==="Space"){ev.preventDefault();togglePause();}
});
function setBuild(type){buildSel=type;selTower=null;renderAll();}
function doUpgrade(){
  if(!selTower)return;
  if(selTower.lvl>=MAXLVL){log("Max level.");return;}
  const c=upgCost(selTower);
  if(S.gold<c){log("Not enough gold for upgrade.");return;}
  S.gold-=c;selTower.lvl++;selTower.spent+=c;selTower.flash=0.25;
  addFloat(selTower.c*CELL+8,selTower.r*CELL,"LVL "+(selTower.lvl+1),"#9fd7ff");
  renderSel();renderGold();
}
function doSell(){
  if(!selTower)return;
  const val=Math.round(selTower.spent*0.6);
  S.gold+=val;
  log("Sold "+TDEF[selTower.t].name+" for $"+val+".");
  S.towers=S.towers.filter(t=>t!==selTower);selTower=null;setTab("build");
}
function buyOps(k){
  const c=opsCost(k);if(S.gold<c){log("Not enough gold.");return;}
  S.gold-=c;S.ops[k]++;log(OPS[k].name+" → lvl "+S.ops[k]+".");renderAll();
}
function togglePause(){S.paused=!S.paused;$("pauseBtn").textContent=S.paused?"▶":"II";$("pauseBtn").classList.toggle("active",S.paused);}
$("pauseBtn").onclick=togglePause;
$("waveBtn").onclick=()=>{if(!inWave)startWave();else log("Wave in progress.");};
$("autoBtn").onclick=()=>{
  S.auto=!S.auto;
  $("autoBtn").textContent="AUTO: "+(S.auto?"ON":"OFF");$("autoBtn").classList.toggle("active",S.auto);
  if(!S.auto&&!inWave)betweenT=1e9; if(S.auto&&!inWave)betweenT=Math.min(betweenT,12);
};
$("spdStat").onclick=()=>{S.speed=S.speed===1?2:S.speed===2?4:1;$("spdV").textContent="x"+S.speed;};

function setTab(t){tab=t;["build","ops","upg"].forEach(k=>$("tab-"+k).classList.toggle("active",k===t));renderAll();}
$("tab-build").onclick=()=>{selTower=null;setTab("build");};
$("tab-ops").onclick=()=>{selTower=null;setTab("ops");};
$("tab-upg").onclick=()=>setTab("upg");

function fmt(n){return n>=1e4?(n/1e3).toFixed(1)+"k":Math.floor(n);}
/* live afford-states: gold drifts every frame, so buttons must refresh with it */
let afford=[];
function refreshAfford(){for(const f of afford){try{f.btn.disabled=f.dis();}catch(e){}}}
function renderGold(){
  $("goldV").textContent=fmt(S.gold);$("livesV").textContent=S.lives;
  refreshAfford();
}
function renderSub(){$("waveV").textContent=Math.max(1,S.wave);$("bestV").textContent=S.best;}
function renderTimer(){
  if(!inWave&&S.auto)$("waveTimer").textContent="next in "+Math.max(0,Math.ceil(betweenT))+"s";
  else if(!inWave)$("waveTimer").textContent="AUTO off";
  else $("waveTimer").textContent=spawnQueue.length+" to spawn";
}
function renderContent(){
  const el=$("content");el.innerHTML="";afford=[];
  if(tab==="build"){
    if(buildSel){
      const h=document.createElement("div");h.className="row";
      h.style.cssText="color:var(--gold);outline:1px solid var(--gold)";
      h.innerHTML=`Placing <b>${TDEF[buildSel].name}</b> — click a grass tile on the map &nbsp;<span style="color:var(--dim)">[0] cancel</span>`;
      el.appendChild(h);
    }
    TYPES.forEach((k,i)=>{
      const d=TDEF[k],row=document.createElement("div");row.className="row";
      row.innerHTML=`<div class="chip" style="background:${d.color}"></div>
        <div class="nm">${i+1}. ${d.name}<div class="info">${d.tip}</div></div>
        <div class="cost">$${d.cost}</div><button class="btn">${buildSel===k?"CANCEL":"BUY"}</button>`;
      const b=row.querySelector("button");
      b.onclick=()=>setBuild(buildSel===k?null:k);
      row.style.outline=buildSel===k?"1px solid var(--gold)":"none";
      afford.push({btn:b,dis:()=>S.gold<d.cost});
      el.appendChild(row);
    });
  } else if(tab==="ops"){
    Object.keys(OPS).forEach(k=>{
      const o=OPS[k],c=opsCost(k),row=document.createElement("div");row.className="row";
      row.innerHTML=`<div class="chip" style="background:#7d5aa0"></div>
        <div class="nm">${o.name} <span style="color:var(--gold)">L${S.ops[k]}</span><div class="info">${o.tip}</div></div>
        <div class="cost">$${fmt(c)}</div><button class="btn">UP</button>`;
      const b=row.querySelector("button");
      b.onclick=()=>buyOps(k);
      afford.push({btn:b,dis:()=>S.gold<opsCost(k)});
      el.appendChild(row);
    });
  } else {
    if(selTower){
      const st=towerStats(selTower),d=TDEF[selTower.t],c=upgCost(selTower);
      const box=document.createElement("div");box.id="selBox";
      box.innerHTML=`<span class="t">${d.name}</span> — LVL ${selTower.lvl+1}${selTower.lvl>=MAXLVL?" (MAX)":""}<br>
        <span class="u">DMG ${st.dmg.toFixed(1)} · ROF ${(1/st.cd).toFixed(1)}/s · RNG ${st.range.toFixed(0)}</span><br>
        ${selTower.lvl>=MAXLVL?'<span class="u">Fully upgraded.</span>':"UPGRADE → <b style='color:var(--gold)'>$"+fmt(c)+"</b> (+30% dmg)"}
        <div style="display:flex;gap:6px;margin-top:4px">
          <button class="btn" id="upgBtn" ${selTower.lvl>=MAXLVL||S.gold<c?"disabled":""}>UPGRADE [U]</button>
          <button class="btn" id="sellBtn">SELL $${fmt(selTower.spent*0.6)} [S]</button>
        </div>`;
      el.appendChild(box);
      $("upgBtn").onclick=doUpgrade;$("sellBtn").onclick=doSell;
      const ub=$("upgBtn"),tw=selTower;
      afford.push({btn:ub,dis:()=>tw.lvl>=MAXLVL||S.gold<upgCost(tw)});
    } else el.innerHTML=`<div class="row" style="color:var(--dim)">Select a turret on the map to upgrade it.</div>`;
  }
  refreshAfford();
}
function renderSel(){if(tab==="upg")renderContent();renderGold();}
function renderAll(){renderGold();renderContent();renderSub();}

/* ============ MAIN LOOP ============ */
function tick(now){
  let dt=(now-lastTick)/1000;lastTick=now;
  if(S.paused)return;
  let rem=Math.min(dt,2.5);
  while(rem>0){const s=Math.min(rem,0.05);for(let i=0;i<S.speed;i++)update(s);rem-=s;}
}
function loop(now){
  tick(now);
  window._frames=(window._frames||0)+1;
  render();renderGold();
  requestAnimationFrame(loop);
}
setInterval(()=>{const now=performance.now();if(now-lastTick<120)return;tick(now);render();renderGold();},250);

/* boot */
load();
setTab("build");
renderAll();
setInterval(save,10000);
window.addEventListener("beforeunload",save);

/* console cheat/debug: IDLE.place(3,2,'sniper'), IDLE.gold=500, IDLE.wave(), IDLE.spawn('brute') */
window.IDLE={
  get gold(){return Math.floor(S.gold);}, set gold(v){S.gold=v;},
  state:S,
  place(c,r,t){if(!TDEF[t]||isRoadCell(c,r)||occupied(c,r))return false;S.towers.push({t,c,r,lvl:0,spent:TDEF[t].cost,cool:0,ang:0,flash:0});renderAll();return true;},
  wave(){if(!inWave)startWave();},
  spawn(t){if(ZDEF[t])spawn(t);},
  click(x,y){const c=x/CELL|0,rr=y/CELL|0;
    if(buildSel){if(isRoadCell(c,rr)||occupied(c,rr)||S.gold<TDEF[buildSel].cost)return;
      S.gold-=TDEF[buildSel].cost;S.towers.push({t:buildSel,c,r:rr,lvl:0,spent:TDEF[buildSel].cost,cool:0,ang:0,flash:0});renderAll();return;}
    selTower=S.towers.find(t=>t.c===c&&t.r===rr)||null;setTab(selTower?"upg":tab);},
  speed:v=>{S.speed=v||1;$("spdV").textContent="x"+(v||1);},
  pause:v=>{S.paused=v!==undefined?v:!S.paused;}
};
requestAnimationFrame(loop);
</script>
</body>
</html>
